packages:
  - packages/*

allowBuilds:
  '@nestjs/core': true
  '@swc/core': true
  better-sqlite3: true
  cpu-features: true
  electron: true
  electron-winstaller: true
  esbuild: true
  leveldown: true
  protobufjs: true
  sharp: true
  ssh2: true

onlyBuiltDependencies:
  - better-sqlite3
  - core-js

# golembot 功能补丁已从 pnpm patch 迁移到构建期注入
# (scripts/patch-golembot.cjs，由 build:server 调用)，不再依赖 pnpm
# patchedDependencies，避免因 golembot/上游版本变动导致 install 失败。
